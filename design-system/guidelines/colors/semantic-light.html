<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--bg);font:var(--body-sm);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.sw i{display:block;height:56px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--label-sm);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;font:var(--label-sm);color:var(--text-muted);margin-top:2px}.lbl{font:var(--label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--bg)"></i><b>bg</b><span></span></div><div class="sw"><i style="background:var(--bg-sunken)"></i><b>bg-sunken</b><span></span></div><div class="sw"><i style="background:var(--surface-card)"></i><b>surface-card</b><span></span></div><div class="sw"><i style="background:var(--text-body)"></i><b>text-body</b><span></span></div><div class="sw"><i style="background:var(--text-secondary)"></i><b>text-secondary</b><span></span></div><div class="sw"><i style="background:var(--text-muted)"></i><b>text-muted</b><span></span></div><div class="sw"><i style="background:var(--accent)"></i><b>accent</b><span></span></div><div class="sw"><i style="background:var(--border)"></i><b>border</b><span></span></div></div></body></html>
