<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--bg);font:var(--body-sm);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.sw i{display:block;height:56px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--label-sm);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;font:var(--label-sm);color:var(--text-muted);margin-top:2px}.lbl{font:var(--label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:12px;align-items:flex-end"><div style="height:var(--control-h-sm);padding:0 var(--control-px-sm);display:inline-flex;align-items:center;border:1.5px solid var(--sw-ink);border-radius:var(--radius-sm);font:var(--body-sm)">Control sm</div><div style="height:var(--control-h-md);padding:0 var(--control-px-md);display:inline-flex;align-items:center;border:1.5px solid var(--sw-ink);border-radius:var(--radius-sm);font:var(--body-sm)">Control md</div><div style="height:var(--control-h-lg);padding:0 var(--control-px-lg);display:inline-flex;align-items:center;border:1.5px solid var(--sw-ink);border-radius:var(--radius-sm);font:var(--body-sm)">Control lg</div></div></body></html>
