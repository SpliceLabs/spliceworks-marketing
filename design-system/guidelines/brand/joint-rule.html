<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--bg);font:var(--body-sm);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.sw i{display:block;height:56px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--label-sm);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;font:var(--label-sm);color:var(--text-muted);margin-top:2px}.lbl{font:var(--label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:32px;align-items:center"><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--sw-joint);display:inline-block"></span><span class="lbl" style="color:var(--text-body)">Live</span></div><div style="display:flex;gap:18px;border-bottom:var(--hairline);padding-bottom:8px"><span style="font:var(--body-sm);position:relative">Overview<span style="position:absolute;left:0;right:0;bottom:-9px;height:2px;background:var(--sw-joint)"></span></span><span style="font:var(--body-sm);color:var(--text-muted)">Reports</span></div><div style="font:var(--heading-3);letter-spacing:var(--tracking-tight)">Splice<span style="color:var(--sw-joint)">.</span></div></div></body></html>
