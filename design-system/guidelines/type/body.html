<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--bg);font:var(--body-sm);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.sw i{display:block;height:56px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--label-sm);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;font:var(--label-sm);color:var(--text-muted);margin-top:2px}.lbl{font:var(--label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:grid;gap:12px;max-width:64ch"><p style="margin:0;font:var(--body-lg)">A splice is where two pieces become one continuous run. 17px for standfirsts and leads.</p><p style="margin:0;font:var(--body-md)">15px is the working body size — dense enough for editorial columns, open enough for product UI. Links are <a href="#">underlined in blue</a>, never bold.</p><p style="margin:0;font:var(--body-sm);color:var(--text-secondary)">13px for captions, table cells and secondary copy in ink-600.</p></div></body></html>
