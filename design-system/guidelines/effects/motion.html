<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--bg);font:var(--body-sm);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.sw i{display:block;height:56px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--label-sm);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;font:var(--label-sm);color:var(--text-muted);margin-top:2px}.lbl{font:var(--label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:32px;align-items:center"><div class="lbl">dur-fast 120ms</div><div class="lbl">dur-base 200ms</div><div class="lbl">dur-slow 360ms</div><div class="lbl">ease-out .2 .7 .2 1</div><div class="lbl">ease-in-out .65 0 .35 1</div></div></body></html>
