<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--bg);font:var(--body-sm);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.sw i{display:block;height:56px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--label-sm);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;font:var(--label-sm);color:var(--text-muted);margin-top:2px}.lbl{font:var(--label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:24px;padding:8px"><div style="flex:1;height:80px;background:var(--surface-card);box-shadow:var(--shadow-sm);border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px"><span class="lbl">shadow-sm</span></div><div style="flex:1;height:80px;background:var(--surface-card);box-shadow:var(--shadow-md);border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px"><span class="lbl">shadow-md</span></div><div style="flex:1;height:80px;background:var(--surface-card);box-shadow:var(--shadow-lg);border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px"><span class="lbl">shadow-lg</span></div></div></body></html>
