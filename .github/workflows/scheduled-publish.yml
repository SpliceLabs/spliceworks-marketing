name: Scheduled publish

# Splice Log entries dated in the future stay hidden until the site is rebuilt
# on or after their date. This redeploys once a day just after midnight UTC.
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
